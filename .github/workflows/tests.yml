name: tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar el paquete
        run: python -c "import subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '-r', 'requirements-build.txt', '-e', '.'], check=True); subprocess.run([sys.executable, '-m', 'pip', 'check'], check=True)"
      - name: Comprobar Tkinter
        run: xvfb-run -a python -c "import tkinter as tk; root=tk.Tk(); root.destroy()"
      - name: Ejecutar pruebas con pantalla virtual
        run: xvfb-run -a python -m unittest discover -s tests -v
