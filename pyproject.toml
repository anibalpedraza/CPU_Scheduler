[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planificador-procesos"
version = "1.0.0"
description = "Simulador educativo interactivo de algoritmos de planificación de CPU"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Aníbal Pedraza Dorado", email = "anibal.pedraza@uclm.es" }
]
license = { text = "MIT" }
keywords = ["sistemas operativos", "planificación", "educación", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Education",
]

[project.scripts]
planificador-procesos = "planificador_procesos.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
